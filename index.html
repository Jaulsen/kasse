<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F6E24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasse">
<title>Weihnachtsmarkt-Kasse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root {
  /* Logo-Grün und Logo-Blau, Neutraltöne leicht grünstichig. Layout: eine Handy-Spalte – Kopf, Filter, Kachelraster, Kassenleiste. */
  --green: #1F6E24;
  --green-dark: #164F1A;
  --green-soft: #E3EFE1;
  --blue: #2158A1;
  --blue-soft: #E2EAF6;
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #17231A;
  --muted: #56645A;
  --line: #D9E0D6;
  --amber: #8A5A00;
  --amber-soft: #FFF2CF;
  --danger: #B3261E;
  --danger-soft: #FBE4E2;
  --font-display: 'Fredoka', 'Trebuchet MS', sans-serif;
  --font-body: 'Nunito Sans', 'Segoe UI', Arial, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }
@media (min-width: 600px) { #app { box-shadow: 0 0 0 1px var(--line); } }

/* ---------- Kopfzeile ---------- */
.top { background: var(--green); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.top .where { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; color: #fff; }
.top .where small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; opacity: .85; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.top .where span { display: block; font-family: var(--font-display); font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); white-space: nowrap; color: #fff; }
.sync.wait { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-soft); }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 0; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; }
.iconbtn svg { width: 22px; height: 22px; }

.banner { background: var(--amber-soft); color: var(--amber); font-weight: 700; font-size: 14px; padding: 8px 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.banner button { border: 1px solid currentColor; background: none; border-radius: 8px; padding: 3px 10px; font-weight: 700; font-size: 13px; color: var(--amber); }

/* ---------- Filter ---------- */
.filters { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px 0; display: flex; flex-direction: column; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; padding: 10px 0; width: 100%; outline: none; font-size: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }

/* ---------- Kachelraster ---------- */
.gridwrap { flex: 1; overflow-y: auto; padding: 12px 14px 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.tile { position: relative; border: 2px solid transparent; background: var(--surface); border-radius: var(--radius); padding: 0; text-align: left; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 0 var(--line); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.tile .pic { aspect-ratio: 4 / 3; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 26px; color: rgba(255,255,255,.92); }
.tile .tx { padding: 7px 9px 9px; display: flex; flex-direction: column; gap: 2px; }
.tile .nm { font-weight: 700; font-size: 14px; line-height: 1.2; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.tile .pr { font-size: 14px; color: var(--muted); font-weight: 600; }
.tile .pr.neg { color: var(--blue); }
.tile.in { border-color: var(--green); }
.tile .qty { position: absolute; top: 6px; right: 6px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 999px; background: var(--green); color: #fff; font-weight: 800; font-size: 15px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
.tile.out { opacity: .55; }
.tile.out .pic { filter: grayscale(1); }
.tile .tag { position: absolute; left: 6px; top: 6px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .03em; }
.tile:active:not(.out) { transform: scale(.97); }
.empty { color: var(--muted); text-align: center; padding: 40px 10px; }
.grouphead { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 15px; margin-top: 6px; }

/* ---------- Kassenleiste ---------- */
.bar { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; gap: 10px; align-items: stretch; }
.bar .sum { flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; text-align: left; padding: 6px 12px; }
.bar .sum small { display: block; color: var(--muted); font-weight: 700; font-size: 13px; }
.bar .sum b { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 800; font-size: 17px; background: var(--green); color: #fff; }
.btn:disabled { background: #AEB8AC; color: #F3F5F1; cursor: not-allowed; }
.btn.blue { background: var(--blue); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); }
.btn.wide { width: 100%; }

/* ---------- Overlays ---------- */
.scrim { position: absolute; inset: 0; background: rgba(15, 25, 17, .45); display: flex; align-items: flex-end; z-index: 20; }
.sheet { background: var(--surface); width: 100%; max-height: 92%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet header { padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 21px; }
.sheet .body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet footer { padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.close { border: 0; background: var(--bg); width: 38px; height: 38px; border-radius: 10px; font-size: 22px; line-height: 1; color: var(--muted); }
.screen { position: absolute; inset: 0; background: var(--bg); z-index: 15; display: flex; flex-direction: column; overflow-y: auto; }

/* Warenkorb */
.line { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line .n { flex: 1; min-width: 0; }
.line .n b { display: block; font-size: 15px; }
.line .n small { color: var(--muted); }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 800; }
.step span { min-width: 26px; text-align: center; font-weight: 800; }
.line .ls { min-width: 72px; text-align: right; font-weight: 800; }

/* Bezahlen */
.lines { display: flex; flex-direction: column; }
.del { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; flex: none; }
.del svg { width: 18px; height: 18px; }
.line .ls { min-width: 64px; }
.codebox { border: 2px dashed var(--green); border-radius: 16px; padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 4px; background: var(--green-soft); }
.codebox small { font-weight: 700; color: var(--green-dark); }
.codebox b { font-family: var(--font-display); font-size: 48px; font-weight: 600; letter-spacing: .08em; color: var(--green-dark); }
.codein { font-family: var(--font-display); font-size: 32px !important; letter-spacing: .2em; text-align: center; }
.due { text-align: center; padding: 4px 0; }
.due small { color: var(--muted); font-weight: 700; display: block; }
.due b { font-family: var(--font-display); font-size: 44px; font-weight: 600; }
.cash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cash button { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px 0; font-weight: 800; font-size: 18px; }
.cash button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 14px; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); font-size: 16px; }
.change { border-radius: 14px; padding: 14px; text-align: center; background: var(--green-soft); }
.change small { display: block; font-weight: 700; color: var(--green-dark); }
.change b { font-family: var(--font-display); font-size: 40px; font-weight: 600; color: var(--green-dark); }
.change.short { background: var(--danger-soft); }
.change.short small, .change.short b { color: var(--danger); }

/* Menü */
.menu a, .menu button.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 13px 4px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 16px; }
.menu .item small { display: block; font-weight: 600; color: var(--muted); font-size: 13px; }
.menu .item .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--green-soft); color: var(--green); display: grid; place-items: center; flex: none; }
.menu .item .ic svg { width: 20px; height: 20px; }
.role { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 6px; background: var(--blue-soft); color: var(--blue); margin-left: 6px; vertical-align: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 9px 4px; font-weight: 700; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.seg.avail button[data-v="ausverkauft"][aria-pressed="true"] { background: var(--amber); }
.seg.avail button[data-v="nicht_da"][aria-pressed="true"] { background: var(--muted); }
.demo { background: var(--blue-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.demo h3 { font-size: 15px; color: var(--blue); }
.demo .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-weight: 700; font-size: 14px; }
.demo .row .seg { flex: 1; max-width: 270px; }

/* Listen */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card .hd { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.card .hd b { font-size: 16px; }
.muted { color: var(--muted); font-size: 14px; }
.pill { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
.pill.ok { background: var(--green-soft); color: var(--green-dark); }
.pill.st { background: var(--danger-soft); color: var(--danger); }
.pill.nt { background: var(--amber-soft); color: var(--amber); }
.pill.q { background: var(--amber-soft); color: var(--amber); }
.pill.s { background: var(--blue-soft); color: var(--blue); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--danger-soft); border-radius: 10px; padding: 8px 10px; color: var(--danger); font-weight: 700; font-size: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stat small { color: var(--muted); font-weight: 700; }
.stat b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 600; }
.availrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.availrow .hd { display: flex; justify-content: space-between; font-weight: 700; }
pre.rows { background: var(--ink); color: #E8F0E6; border-radius: 12px; padding: 12px; font-size: 12px; overflow-x: auto; margin: 0; line-height: 1.45; }

/* Start */
.start { padding: 28px 20px; display: flex; flex-direction: column; gap: 18px; max-width: 460px; margin: 0 auto; width: 100%; }
.start img { width: 240px; max-width: 70%; height: auto; }
.start h1 { font-size: 28px; color: var(--green-dark); }
.start p { margin: 0; color: var(--muted); line-height: 1.45; }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--danger); font-weight: 700; font-size: 14px; }
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mbtn { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.mbtn b { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.mbtn .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.mbtn .cats span { font-size: 12px; font-weight: 700; background: var(--bg); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
.mbtn[aria-current="true"] { border-color: var(--green); }

/* Toast */
.toast { position: absolute; left: 14px; right: 14px; top: 68px; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; font-weight: 700; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast b { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: #BFE3BA; }

@media (prefers-reduced-motion: no-preference) {
  .sheet.anim { animation: up .22s ease-out; }
  .toast.anim { animation: fade .2s ease-out; }
  @keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}

/* ---------- Ergänzungen der echten App ---------- */
.start.login { position: relative; padding-top: 24px; }
.start.login .corner { width: 120px; max-width: 34%; align-self: flex-start; }
.start.login .apptitle { font-size: 40px; line-height: 1.1; color: var(--green-dark); margin: 28px 0 12px; }
.info-msg { background: var(--amber-soft); color: var(--amber); border-radius: 10px; padding: 10px 12px; font-weight: 700; margin: 0; }
.whoami { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 700; font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.whoami .mini-btn { margin: 0; }
.katform { display: flex; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.katform input { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-size: 16px; min-width: 0; flex: 1; }
.katform .small-in { flex: 0 0 56px; }
.katform input[type=color] { flex: 0 0 44px; height: 40px; padding: 2px; }
.katform .mini-btn { margin: 0; }
.swatch { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 0; }

.person { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.useractions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pinin { width: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 16px; }
.plist { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.prow .thumb { width: 56px; height: 42px; border-radius: 8px; overflow: hidden; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 600; flex: none; }
.prow .thumb img { width: 100%; height: 100%; object-fit: cover; }
.prow .pn { flex: 1; min-width: 0; }
.prow .pn b { display: block; font-size: 15px; }
.prow .pn small { color: var(--muted); font-size: 13px; }
.prow > .num { font-weight: 800; }
.formrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.formrow .field, .formrow input, .formrow select { min-width: 0; width: 100%; }
.imgedit { display: flex; gap: 12px; align-items: center; }
.imgedit img, .imgedit .ph { width: 160px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--bg); display: grid; place-items: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); }
.filebtn { font-size: 14px; padding: 10px 14px; cursor: pointer; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.tb { position: relative; width: 84px; height: 63px; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); text-align: center; padding: 2px; }
.tb img { width: 100%; height: 100%; object-fit: cover; }
.tb.new { border: 2px solid var(--green); }
.tb button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 999px; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; line-height: 24px; padding: 0; }
.tb.add { border: 2px dashed var(--green); color: var(--green); font-weight: 800; font-size: 14px; cursor: pointer; }

.neg { color: var(--blue) !important; }
.due.payout { background: var(--blue-soft); border: 2px solid var(--blue); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.due.payout small, .due.payout b, .due.payout span { color: var(--blue); }
.due.payout small { text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.due.payout span { font-weight: 700; font-size: 14px; }
.btn.payout { background: var(--blue); }
.bar .sum.payout { background: var(--blue-soft); border-color: var(--blue); }
.bar .sum.payout small, .bar .sum.payout b { color: var(--blue); }
.cash { grid-template-columns: repeat(3, 1fr); }
.cash button { position: relative; }
.cash .cnt { position: absolute; top: -6px; right: -4px; background: var(--blue); color: #fff; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 7px; }
.givenrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
.mini-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 13px; margin-left: 6px; }
.toast .neg-t { color: #A9C8F5; }

.cell { position: relative; display: flex; }
.cell .tile { width: 100%; }
.tile .pic { position: relative; overflow: hidden; }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .tag { top: auto; bottom: 6px; left: 6px; }
.info { position: absolute; left: 6px; top: 6px; width: 30px; height: 30px; border-radius: 999px; border: 0; background: rgba(255,255,255,.94); color: var(--blue); font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 18px; line-height: 30px; text-align: center; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
.gallery figure { margin: 0; flex: none; width: 82%; max-width: 360px; scroll-snap-align: start; }
.gallery img, .gallery .ph { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; display: block; background: var(--bg); }
.gallery .ph { display: grid; place-items: center; color: var(--muted); font-weight: 700; font-size: 14px; text-align: center; padding: 10px; border: 1px dashed var(--line); }
.gallery figcaption { font-size: 12px; color: var(--muted); margin-top: 4px; }
.desc { white-space: pre-line; line-height: 1.5; margin: 0; }
.doc { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; color: var(--ink); font-weight: 700; background: var(--surface); }
.doc small { display: block; color: var(--muted); font-weight: 600; }
.doc .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 800; }
.infohead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
